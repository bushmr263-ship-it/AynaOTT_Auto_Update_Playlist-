name: AynaOTT Playlist Auto Update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aynaott:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Run AynaOTT Script
        run: python Scripts/aynaott_playlist.py

      - name: Commit and Push AynaOTT Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AynaOTT.m3u AynaOTT_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto update AynaOTT playlist and JSON"
            git push origin main
          else
            echo "No changes to AynaOTT.m3u or AynaOTT_data.json"
          fi
